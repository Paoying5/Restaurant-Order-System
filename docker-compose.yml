services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  db:
    image: postgres:16-alpine

    container_name: restaurant-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  # ==========================================================
  # Backend
  # ==========================================================

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile

    container_name: restaurant-backend

    environment:
      NODE_ENV: development

      PORT: 5000

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${BACKEND_PORT}:5000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # Frontend
  # ==========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile

    container_name: restaurant-frontend

    environment:
      VITE_API_URL: ${VITE_API_URL}

    ports:
      - "${FRONTEND_PORT}:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

    restart: unless-stopped


# ============================================================
# Volumes
# ============================================================

volumes:
  postgres_data:
    name: restaurant_postgres_data

  backend_node_modules:
    name: restaurant_backend_node_modules

  frontend_node_modules:
    name: restaurant_frontend_node_modules
